<!DOCTYPE html>
<html>
<head>
    <title>Feedback - Bollywood's Golden 100</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>

<header>
    <h1>Bollywood's Golden 100</h1>
    <p>We Want Your Opinion</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="top100.html">The Top 100</a>
    <a href="faq.html">FAQs</a>
    <a href="contact.html">Contact Us</a>
    <a href="feedback.html">Feedback</a>
</nav>

<div class="container">
    <h2>Suggest a Movie</h2>
    <p>Did we miss a classic? Tell us which movie should be added to the Top 100!</p>

    <form>
        <label for="movie-title">Movie Title:</label>
        <input type="text" id="movie-title" name="movie-title" placeholder="e.g., Kabhi Khushi Kabhie Gham">

        <label for="release-year">Release Year:</label>
        <input type="text" id="release-year" name="release-year" placeholder="e.g., 2001">

        <label for="reason">Why does it deserve to be on the list?</label>
        <textarea id="reason" name="reason" rows="4" placeholder="It has the best songs, great acting..."></textarea>

        <input type="submit" value="Submit Suggestion">
    </form>
</div>

</body>
</html>
